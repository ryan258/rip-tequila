{{ $accent := .Params.accent | default "red" }}
<a class="product-card interactive-card" href="{{ .RelPermalink }}" data-accent="{{ $accent }}">
  <span class="product-card__stripe"></span>
  <span class="product-card__bottle" aria-hidden="true">
    <span class="product-card__neck"></span>
    <span class="product-card__body">
      <span class="product-card__label">
        <strong>RIP</strong>
        <i class="{{ .Params.icon }}" aria-hidden="true"></i>
      </span>
    </span>
  </span>
  <span class="product-card__kicker">{{ .Params.variant }}</span>
  <span class="product-card__name">{{ .Title }}</span>
  <span class="product-card__glyph" aria-hidden="true"><i class="{{ .Params.icon }}"></i></span>
  <span class="product-card__line">{{ .Params.line }}</span>
  <span class="product-card__descriptor">{{ .Params.descriptor }}</span>
</a>
