<section class="slogan-band" aria-label="RIP Tequila campaign slogans">
  <div class="slogan-band__inner scroll-strip">
    {{ range hugo.Data.slogans.items }}
      <div class="slogan-card interactive-card">
        <span class="slogan-card__icon" aria-hidden="true"><i class="{{ .icon }}"></i></span>
        <span class="slogan-card__text">{{ .text }}</span>
      </div>
    {{ end }}
  </div>
</section>
