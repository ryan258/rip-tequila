<section class="brand-intro" aria-labelledby="brand-intro-title">
  <div class="brand-intro__inner">
    <div class="brand-intro__copy">
      <p class="section-heading__eyebrow">{{ .Params.eyebrow }}</p>
      <h2 class="section-heading__title" id="brand-intro-title">{{ .Title }}</h2>
      <p class="section-heading__body">{{ .Params.body }}</p>
      <p class="brand-intro__support">{{ .Params.support }}</p>
      <a class="button button--dark" href="{{ strings.TrimPrefix "/" .Params.cta.href | relURL }}">{{ .Params.cta.label }}</a>
    </div>
    <div class="brand-intro__visual" aria-hidden="true">
      <img class="brand-intro__visual-img" src="{{ "images/cantina-archway-bg.webp" | relURL }}" alt="" loading="lazy" decoding="async">
      <span class="brand-intro__doorway-tag">
        <span class="brand-intro__doorway-title">LA CANTINA</span>
        <span class="brand-intro__doorway-sub">DEL ÚLTIMO TRAGO</span>
      </span>
    </div>
  </div>
</section>
