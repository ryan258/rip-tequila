<div class="section-heading{{ with .class }} {{ . }}{{ end }}">
  {{ with .eyebrow }}<p class="section-heading__eyebrow">{{ . }}</p>{{ end }}
  {{ with .title }}<h2 class="section-heading__title"{{ with $.id }} id="{{ . }}"{{ end }}>{{ . }}</h2>{{ end }}
  {{ with .body }}<p class="section-heading__body">{{ . }}</p>{{ end }}
</div>
