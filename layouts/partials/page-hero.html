{{ $heroTheme := .Params.hero_theme | default "cream" }}
<section class="page-hero{{ if eq $heroTheme "cream" }} page-hero--cream{{ end }}">
  <div class="page-hero__inner">
    <div class="page-hero__copy">
      <p class="section-heading__eyebrow">{{ .Params.eyebrow | default "RIP Tequila" }}</p>
      <h1 class="page-hero__title">{{ .Params.headline | default .Title }}</h1>
      <p class="page-hero__body">{{ .Description }}</p>
      {{ with .Params.cta_label }}
        <a class="button button--primary" href="{{ $.Params.cta_href | default "/" }}">{{ . }}</a>
      {{ end }}
    </div>
    <div class="page-hero__icon" aria-hidden="true">
      <i class="{{ .Params.icon | default "fa-solid fa-skull" }}"></i>
    </div>
  </div>
</section>
