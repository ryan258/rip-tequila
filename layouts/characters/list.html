{{ define "main" }}
{{ partial "page-hero.html" . }}
{{ if .Content }}
<section class="editorial-section">
  <div class="editorial-section__inner">
    {{ .Content }}
  </div>
</section>
{{ end }}
<section class="catalog-section" aria-label="Full RIP Tequila character cast">
  <div class="catalog-section__inner character-strip__grid" role="list">
    {{ range .Pages.ByWeight }}
      <div role="listitem">{{ partial "character-card.html" . }}</div>
    {{ end }}
  </div>
</section>
{{ end }}
