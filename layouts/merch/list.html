{{ define "main" }}
{{ partial "page-hero.html" . }}
{{ if .Content }}
<section class="editorial-section">
  <div class="editorial-section__inner">
    {{ .Content }}
  </div>
</section>
{{ end }}
<section class="catalog-section" aria-label="RIP Tequila merch concepts">
  <div class="catalog-section__inner merch-preview__grid" role="list">
    {{ range .Pages.ByWeight }}
      <div role="listitem">{{ partial "merch-card.html" . }}</div>
    {{ end }}
  </div>
</section>
{{ partial "sections/disclaimer.html" . }}
{{ end }}
