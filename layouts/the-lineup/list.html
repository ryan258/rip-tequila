{{ define "main" }}
{{ partial "page-hero.html" . }}
{{ if .Content }}
<section class="editorial-section">
  <div class="editorial-section__inner">
    {{ .Content }}
  </div>
</section>
{{ end }}
<section class="catalog-section catalog-section--dark" aria-label="Full RIP Tequila lineup">
  <div class="catalog-section__inner product-preview__grid" role="list">
    {{ range .Pages.ByWeight }}
      <div role="listitem">{{ partial "product-card.html" . }}</div>
    {{ end }}
  </div>
</section>
{{ partial "sections/disclaimer.html" . }}
{{ end }}
