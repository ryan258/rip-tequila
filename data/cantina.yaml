geography:
  - id: "long-mahogany-bar"
    title: "The Long Mahogany Bar"
    image: "images/cantina/the-long-mahogany-bar.webp"
    desc: "Cantina Jack’s sacred domain. Polished until you can see your own startled reflection, lined with heavy bottomed glassware and bottles that glow like liquid topaz under the low amber lights."
    character: "Cantina Jack"
    character_href: "/characters/cantina-jack/"

  - id: "crimson-stage"
    title: "The Crimson Stage"
    image: "images/cantina/the-crimson-stage.webp"
    desc: "A modest platform draped in dusty black velvet where <strong>La Rosa Negra</strong> commands the room. When her voice rises, conversations freeze mid-sentence and glasses pause halfway to lips."
    character: "La Rosa Negra"
    character_href: "/characters/la-rosa-negra/"

  - id: "red-ribboned-bell"
    title: "The Red-Ribboned Bell"
    image: "images/cantina/the-red-ribboned-bell.webp"
    desc: "Forged from solid brass and mounted directly above the heavy entrance. <strong>Campana Roja</strong> keeps one hand near the cord. It chimes once per evening — the exact moment your casual stop-in becomes an indelible chapter of your personal mythology."
    character: "Campana Roja"
    character_href: "/characters/campana-roja/"

  - id: "absolution-booth"
    title: "The Absolution Booth"
    image: "images/cantina/the-absolution-booth.webp"
    desc: "A leather-lined corner booth where <strong>Padre Proof</strong> presides with a small black book, nodding sympathetically as patrons confess why they ordered that fourth round on a Tuesday."
    character: "Padre Proof"
    character_href: "/characters/padre-proof/"

  - id: "back-office"
    title: "The Back Office"
    image: "images/cantina/the-back-office.webp"
    desc: "Where <strong>El Sepulturero</strong> meticulously records every name, toast, and forgotten argument in a <strong>leather-bound manifest</strong> that never leaves the building."
    character: "El Sepulturero"
    character_href: "/characters/el-sepulturero/"

  - id: "moonlit-patio"
    title: "The Moonlit Patio"
    image: "images/cantina/the-moonlit-patio.webp"
    desc: "Where <strong>Los Maracas</strong> keep a relentless, syncopated rhythm going on brass and bone, because nobody in the afterlife believes in closing time."
    character: "Los Maracas"
    character_href: "/characters/los-maracas/"

  - id: "high-back-chair"
    title: "The High Back Chair"
    image: "images/cantina/the-high-back-chair.webp"
    desc: "Carved from dark ironwood at the head of the bar. It belongs to <strong>Don Muerte</strong>. Even when it sits empty, you can feel the room organizing itself around it."
    character: "Don Muerte"
    character_href: "/characters/don-muerte/"
