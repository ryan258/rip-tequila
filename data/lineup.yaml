tasting_notes:
  eyebrow: "Tasting Notes"
  title: "Flavor That Haunts"
  items:
    - variant: "Blanco"
      icon: "star-burst"
      notes: "Citrus peel, agave nectar, white pepper, fresh earth."
    - variant: "Reposado"
      icon: "star-diamond"
      notes: "Vanilla, caramel, baked agave, cinnamon."
    - variant: "Añejo"
      icon: "star-eight"
      notes: "Dark honey, toasted oak, dried fruit, cacao."
    - variant: "Extra Añejo"
      icon: "star-cross"
      notes: "Toffee, espresso, worn leather, spice."
    - variant: "Reserve"
      icon: "moon-star"
      notes: "Dark chocolate, smoked agave, raisins, night air."

timeline:
  eyebrow: "A Night, Five Destinations"
  title: "The Hours Don't Lie"
  items:
    - time: "8PM"
      icon: "moon"
      subtitle: "The First Pour"
      bottle: "RIP Blanco"
      desc: "The night begins here."
    - time: "9PM"
      icon: "bell"
      subtitle: "The Call"
      bottle: "RIP Reposado"
      desc: "You've been summoned."
    - time: "11PM"
      icon: "skull"
      subtitle: "Deeper In"
      bottle: "RIP Añejo"
      desc: "Stories get better."
    - time: "1AM"
      icon: "cross"
      subtitle: "No Turning Back"
      bottle: "RIP Extra Añejo"
      desc: "Legends are remembered."
    - time: "2AM+"
      icon: "star"
      subtitle: "After Midnight"
      bottle: "Midnight Agave Reserve"
      desc: "For those who stay."

banner:
  quote: "“THE DEAD DON'T DRINK ISN'T TRUE. THEY JUST DRINK DIFFERENTLY.”"
  author: "DON MUERTE"
  portrait: "images/cast/don-muerte.webp"
  label: "LA LEYENDA"
