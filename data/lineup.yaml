tasting_notes:
  eyebrow: "Tasting Notes"
  title: "Flavor That Haunts"
  items:
    - variant: "Blanco"
      icon: "star-burst"
      notes: "Lime oil, white pepper, fresh agave, canceled morning commitments."
    - variant: "Reposado"
      icon: "star-diamond"
      notes: "Vanilla, baked agave, cinnamon, shared-bill optimism."
    - variant: "Añejo"
      icon: "star-eight"
      notes: "Dark cacao, toasted oak, black cherry, ceremonial confidence."
    - variant: "Extra Añejo"
      icon: "star-cross"
      notes: "Espresso, charred oak, worn leather, airtight silence."
    - variant: "Reserve"
      icon: "moon-star"
      notes: "Desert sage, smoked agave, mesquite, road dust, night air."

timeline:
  eyebrow: "A Night, Five Destinations"
  title: "The Hours Don't Lie"
  items:
    - time: "8:07 PM"
      icon: "moon"
      subtitle: "The Alibi Still Works"
      bottle: "RIP Blanco"
      desc: "A first pour nobody is ready to call a first pour."
    - time: "9:42 PM"
      icon: "bell"
      subtitle: "The Bell Makes It Official"
      bottle: "RIP Reposado"
      desc: "The casual stop-in becomes part of the permanent record."
    - time: "11:58 PM"
      icon: "skull"
      subtitle: "The Room Earns a Toast"
      bottle: "RIP Añejo"
      desc: "The truth improves each time somebody repeats it."
    - time: "1:43 AM"
      icon: "cross"
      subtitle: "The NDA Hour"
      bottle: "RIP Extra Añejo"
      desc: "The Manifest opens. The details become expensive."
    - time: "2:17 AM"
      icon: "star"
      subtitle: "The Road Chooses You"
      bottle: "Midnight Agave Reserve"
      desc: "Allocation confirmed by hat tilt. Criteria unavailable."

banner:
  quote: "“A LINEUP IS NOT FIVE BOTTLES. IT IS ONE NIGHT MAKING FIVE INCREASINGLY EXPENSIVE ARGUMENTS.”"
  author: "DON MUERTE"
  portrait: "images/cast/don-muerte.webp"
  label: "HOUSE DOCTRINE"
